services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fdq
      POSTGRES_PASSWORD: fdq
      POSTGRES_DB: fdq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdq -d fdq"]
      interval: 5s
      timeout: 3s
      retries: 10

  # BI для витрин и дашборда «здоровья данных»: docker compose --profile bi up -d
  metabase:
    image: metabase/metabase:latest
    profiles: ["bi"]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
